<!DOCTYPE html>
<html>
<head>
  <title>Greenhouse Spectral</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #121212; 
      color: #e0e0e0; 
      text-align: center; 
      margin: 0; 
      padding: 15px; 
      overscroll-behavior: none;
    }
    
    /* --- Header Grid --- */
    .status-panel { 
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      background: #1e1e1e; 
      padding: 15px; 
      border-radius: 16px; 
      margin-bottom: 20px; 
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    
    .status-item { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;}
    .status-val { font-size: 16px; font-weight: bold; color: #fff; }
    
    /* Highlight the PAR value */
    .par-box { background: #2c2c2c; border-radius: 8px; padding: 8px; border: 1px solid #444; }
    #par-disp { color: #00d5ff; font-size: 22px; }

    #sat-indicator { 
      font-size: 11px; font-weight: bold; 
      background: #333; color: #666;
      padding: 4px 8px; border-radius: 4px; 
    }
    .saturated { background: #ff453a !important; color: white !important; }

    button { 
      width: 100%; padding: 15px; font-size: 16px; 
      background: #0A84FF; color: white; border: none; 
      border-radius: 12px; margin-bottom: 20px; font-weight: 600; cursor: pointer;
    }

    /* --- Graph --- */
    .graph-container { 
      display: flex; justify-content: space-between; margin-top: 10px; height: 300px;
    }
    .col-wrapper { width: 11%; display: flex; flex-direction: column; align-items: center; }
    .bar-val { font-size: 9px; margin-bottom: 5px; color: #bbb; height: 12px; }
    
    .track {
      width: 100%; flex-grow: 1; /* Fills available height */
      background: #252525; border-radius: 4px;
      display: flex; align-items: flex-end; overflow: hidden; position: relative;
    }

    .bar { width: 100%; min-height: 2px; transition: height 0.2s ease-out; border-radius: 2px 2px 0 0; }
    .bar-label { font-size: 10px; margin-top: 8px; color: #666; }

    /* Wavelength Colors */
    #b0 { background: #7600ed; } /* 415 */
    #b1 { background: #0028ff; } /* 445 */
    #b2 { background: #00d5ff; } /* 480 */
    #b3 { background: #00ff00; } /* 515 */
    #b4 { background: #a3ff00; } /* 555 */
    #b5 { background: #ffdf00; } /* 590 */
    #b6 { background: #ff4f00; } /* 630 */
    #b7 { background: #ff0000; } /* 680 */
  </style>
</head>
<body>

  <div class="status-panel">
    <div>
      <div class="status-item">Gain</div>
      <div class="status-val" id="gain-disp">--</div>
    </div>
    
    <div class="par-box">
      <div class="status-item" style="color:#00d5ff">umol/m2/s</div>
      <div class="status-val" id="par-disp">0</div>
    </div>

    <div>
      <div class="status-item">Status</div>
      <div id="sat-indicator">READY</div>
    </div>
  </div>

  <button id="conBtn" onclick="connect()">CONNECT SENSOR</button>

  <div class="graph-container">
    </div>

<script>
  const serviceUUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const charUUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
  const wavelengths = ["415", "445", "480", "515", "555", "590", "630", "680"];

  // 1. IRRADIANCE CALIBRATION (Energy flattening)
  // Adjust these if specific colors look "too high" compared to sunlight
  const energyFactors = [3.4, 2.8, 2.2, 1.6, 1.2, 1.5, 1.9, 2.5];

  // 2. PHOTON WEIGHTING (Energy to PAR conversion)
  // Longer wavelength (Red) = More photons per Watt. 
  // Factor ~ Wavelength / constant. 
  // 415nm gets 0.8x weight, 680nm gets 1.4x weight relative to middle green.
  const photonWeights = [0.83, 0.89, 0.96, 1.03, 1.11, 1.18, 1.26, 1.36];

  let maxGraphVal = 50; 
  let incomingBuffer = ""; 

  // Build HTML
  const graphContainer = document.querySelector('.graph-container');
  wavelengths.forEach((wl, i) => {
    let html = `
      <div class="col-wrapper">
        <div class="bar-val" id="v${i}">0</div>
        <div class="track">
            <div id="b${i}" class="bar" style="height:1%"></div>
        </div>
        <div class="bar-label">${wl}</div>
      </div>`;
    graphContainer.innerHTML += html;
  });

  async function connect() {
    try {
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'Spectrum_Pro' }],
        optionalServices: [serviceUUID]
      });
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(serviceUUID);
      const characteristic = await service.getCharacteristic(charUUID);
      await characteristic.startNotifications();
      characteristic.addEventListener('characteristicvaluechanged', handleData);
      document.getElementById("sat-indicator").innerText = "LIVE";
      document.getElementById("sat-indicator").style.color = "#0f0";
      document.getElementById("conBtn").style.display = "none";
    } catch (error) {
      alert("Error: " + error);
    }
  }

  function handleData(event) {
    let decoder = new TextDecoder('utf-8');
    incomingBuffer += decoder.decode(event.target.value);

    let newlineIndex = incomingBuffer.indexOf('\n');
    while (newlineIndex !== -1) {
       let line = incomingBuffer.substring(0, newlineIndex).trim();
       incomingBuffer = incomingBuffer.substring(newlineIndex + 1);
       if (line.length > 0) processLine(line);
       newlineIndex = incomingBuffer.indexOf('\n');
    }
  }

  function processLine(raw) {
    let parts = raw.split(',');
    if (parts.length < 9) return; 

    let gainLabel = parts[8];
    document.getElementById('gain-disp').innerText = gainLabel;
    
    let gainVal = 256; 
    if(gainLabel.includes("x")) gainVal = parseFloat(gainLabel.replace("x",""));

    let rawValues = parts.slice(0, 8).map(Number);
    
    // Saturation Check
    let isSaturated = rawValues.some(v => v > 60000);
    let satBadge = document.getElementById('sat-indicator');
    if(isSaturated) {
        satBadge.innerText = "SATURATED";
        satBadge.classList.add('saturated');
    } else {
        satBadge.innerText = "LIVE";
        satBadge.classList.remove('saturated');
    }

    // --- CALCULATIONS ---
    let totalPARScore = 0;
    let calibratedValues = [];

    rawValues.forEach((raw, i) => {
        // Step A: Normalize Raw Count to roughly "Energy"
        let irradiance = (raw / gainVal) * energyFactors[i];
        
        // Step B: Convert "Energy" to "Photons" (PAR weighting)
        let parContribution = irradiance * photonWeights[i];
        
        totalPARScore += parContribution;
        calibratedValues.push(irradiance);
    });

    // --- DISPLAY UPDATES ---

    // 1. PAR Display
    // We apply a final multiplier (x10) just to make the number look readable (e.g. 250 instead of 25.0)
    // You can calibrate this x10 to match a real meter if you ever borrow one.
    document.getElementById('par-disp').innerText = (totalPARScore * 0.000615).toFixed(2);

    // 2. Graph Scaling
    let currentMax = Math.max(...calibratedValues);
    if (currentMax > maxGraphVal) maxGraphVal = currentMax;
    maxGraphVal = maxGraphVal * 0.98; 
    if(maxGraphVal < 5) maxGraphVal = 5; 

    // 3. Render Bars
    calibratedValues.forEach((val, i) => {
      let elVal = document.getElementById('v' + i);
      if(elVal) elVal.innerText = val.toFixed(1);
      
      let elBar = document.getElementById('b' + i);
      if(elBar) {
        let h = (val / maxGraphVal) * 100; 
        if(h > 100) h = 100;
        elBar.style.height = h + "%";
      }
    });
  }
</script>
</body>
</html>
