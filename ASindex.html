<script>
  const serviceUUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const charUUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
  const wavelengths = ["415", "445", "480", "515", "555", "590", "630", "680"];
  
  let maxGraphVal = 1000; 
  let incomingBuffer = ""; // The "waiting room" for broken packets

  // Generate HTML for bars dynamically
  const barsContainer = document.querySelector('.bars');
  wavelengths.forEach((wl, i) => {
    let html = `
      <div class="bar-container">
        <div class="bar-val" id="v${i}">0</div>
        <div id="b${i}" class="bar" style="height:1%"></div>
        <div class="bar-label">${wl}</div>
      </div>`;
    barsContainer.innerHTML += html;
  });

  async function connect() {
    try {
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'Spectrum_Pro' }],
        optionalServices: [serviceUUID]
      });
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(serviceUUID);
      const characteristic = await service.getCharacteristic(charUUID);
      await characteristic.startNotifications();
      characteristic.addEventListener('characteristicvaluechanged', handleData);
      
      document.getElementById("conn-status").innerText = "Live";
      document.getElementById("conn-status").style.color = "#0f0";
      document.getElementById("conBtn").style.display = "none";
    } catch (error) {
      alert("Error: " + error);
    }
  }

  function handleData(event) {
    let decoder = new TextDecoder('utf-8');
    let chunk = decoder.decode(event.target.value);
    
    // 1. Add new chunk to the waiting room
    incomingBuffer += chunk;

    // 2. Check if we have a full line (indicated by \n)
    let newlineIndex = incomingBuffer.indexOf('\n');
    
    while (newlineIndex !== -1) {
       // Extract the full line
       let line = incomingBuffer.substring(0, newlineIndex).trim();
       // Remove it from buffer
       incomingBuffer = incomingBuffer.substring(newlineIndex + 1);
       
       // Process the clean line
       if (line.length > 0) processLine(line);
       
       // Check if there is another line in the buffer
       newlineIndex = incomingBuffer.indexOf('\n');
    }
  }

  function processLine(raw) {
    let parts = raw.split(',');

    // Safety check: We expect at least 9 items (8 vals + gain)
    if (parts.length < 9) return; 

    // Update Gain Display
    let gainStr = parts[8]; 
    document.getElementById('gain-disp').innerText = gainStr || "Auto";

    // Parse values
    let values = parts.slice(0, 8).map(Number);
    
    // Check Saturation
    let isSaturated = values.some(v => v > 60000);
    let satBadge = document.getElementById('sat-indicator');
    if(isSaturated) {
        satBadge.classList.add('saturated');
        satBadge.innerText = "SATURATION!";
    } else {
        satBadge.classList.remove('saturated');
        satBadge.innerText = "OK";
    }

    // Auto-scale graph
    let currentMax = Math.max(...values);
    if (currentMax > maxGraphVal) maxGraphVal = currentMax;
    maxGraphVal = maxGraphVal * 0.99; // Slow decay
    if(maxGraphVal < 1000) maxGraphVal = 1000;

    // Update Bars
    values.forEach((val, i) => {
      let elVal = document.getElementById('v' + i);
      let elBar = document.getElementById('b' + i);
      if(elVal && elBar) {
        elVal.innerText = val;
        let h = (val / maxGraphVal) * 100; 
        if(h > 100) h = 100;
        elBar.style.height = h + "%";
      }
    });
  }
</script>
